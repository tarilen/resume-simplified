apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resume-app
  namespace: argocd

spec:
  project: default
  source:
    repoURL: "https://github.com/tarilen/resume-simplified.git"
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true