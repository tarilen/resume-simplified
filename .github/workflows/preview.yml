name: pr-preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  pull-requests: write          # lets the action comment the preview URL

env:
  # Standard Azure envs for azure/login
  ARM_USE_OIDC: "true"
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # TF_VAR_ prefixes map to OpenTofu/Terraform variables
  TF_VAR_client_id: ${{ secrets.AZURE_CLIENT_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Tofu init (read-only — NO apply)
        working-directory: tofu
        run: tofu init -input=false

      - name: Read outputs
        id: tfout
        working-directory: tofu
        run: |
          TOKEN=$(tofu output -raw swa_api_token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.tfout.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}   # needed for the PR comment
          action: upload
          app_location: "site"
          skip_app_build: true
          # no deployment_environment → pull_request context auto-makes a preview env

  close-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Tofu init (read-only — NO apply)
        working-directory: tofu
        run: tofu init -input=false

      - name: Read outputs
        id: tfout
        working-directory: tofu
        run: |
          TOKEN=$(tofu output -raw swa_api_token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Close preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.tfout.outputs.token }}
          action: close