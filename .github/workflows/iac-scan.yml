name: iac-scan

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tofu/**'

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    concurrency:
      group: iac_scan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Checkov
        id: runCheckov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12.3134.0
        with:
          directory: tofu/
          output_format: sarif
          soft_fail: true

      - name: Upload results to Security tab
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
            sarif_file: results.sarif
