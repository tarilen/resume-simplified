apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
spec:

  selector:
    matchLabels:
      app: {{ .Values.appName }}

  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          resources:
            requests:
              cpu: 50m
            limits:
              cpu: 100m
          readinessProbe: # is container ready to receive traffic?
            httpGet:
              path: {{ .Values.httpGetPath }}
              port: {{ .Values.httpGetPort }}
            initialDelaySeconds: {{ .Values.initialDelaySecondsReadiness }}
            periodSeconds: {{ .Values.periodSecondsReadiness }}
          livenessProbe: # is container stuck/wedged?
            httpGet:
              path: {{ .Values.httpGetPath }}
              port: {{ .Values.httpGetPort }}
            initialDelaySeconds: {{ .Values.initialDelaySecondsLiveness }}
            periodSeconds: {{ .Values.periodSecondsLiveness }}
          ports:
            - name: {{ .Values.portName }}
              containerPort: {{ .Values.httpPort }}